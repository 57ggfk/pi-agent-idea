<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome line glyph on purpose: the New UI tool window stripe repaints
       every SVG element with one theme color (StrokeKt.toStrokeIcon), so a
       filled background badge collapses into a solid block. Strokes only, and
       the color sits on each path so the repaint picks it up. -->
  <path d="M4.2 4.8H11.8" fill="none" stroke="#6C707E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M5.7 4.8V11.2" fill="none" stroke="#6C707E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10.3 4.8C10.3 7.7 10 9.4 8.5 11.1" fill="none" stroke="#6C707E" stroke-width="1.5" stroke-linecap="round"/>
</svg>
