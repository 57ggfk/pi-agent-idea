# -- prompts pushed into the composer (spec 015) -----------------------------
prompt.sendSelection=关于 `{0}`：\n
prompt.explainSelection=请解释 `{0}` 中的以下代码（先简明解释，再指出你注意到的问题）：\n
prompt.fixSelection=请修复 `{0}` 中的以下代码：给出修正后的代码，并简要说明问题所在：\n
prompt.explain.file=请解释上面的引用文件：总结它的作用，并指出可疑之处。
prompt.explain.dir=请解释上面的引用目录：总结它的结构和用途（每个子目录和关键文件是做什么的），并指出可疑之处。
prompt.explain.caret=（光标在第 {0} 行）
