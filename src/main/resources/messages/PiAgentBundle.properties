action.PiAgent.AddDirectory.text=Add Directory to Pi
action.PiAgent.AddDirectory.description=List the selected directory's structure in the pi composer
action.PiAgent.SendFile.text=Send File to Pi Agent
action.PiAgent.SendFile.description=Send the whole file to pi with its path context
action.PiAgent.ExplainFile.text=Explain File with Pi
action.PiAgent.ExplainFile.description=Ask pi to summarize the whole file and flag anything suspicious
action.PiAgent.GenerateCommitMessage.text=Generate Commit Message with Pi
action.PiAgent.GenerateCommitMessage.description=Ask pi to write a Conventional Commits message for the included changes
