# Pi Agent IDE-side strings — English base (spec 008 D7).
# The web-side dictionaries are intentionally separate (FR-018): the IDE side
# follows the IDE language pack and cannot be overridden in-app.
# Actions and groups are localized BY ID: the platform looks up
# `action.<action-id>.text` / `.description` and `group.<group-id>.description`
# only when plugin.xml declares no text/description attribute for that element.
# Renaming an id in plugin.xml therefore requires renaming these keys too.
group.PiAgent.EditorPopup.description=Send code to the pi agent
group.PiAgent.FilePopup.description=Send a file to the pi agent
action.PiAgent.ExplainSelection.text=Explain with Pi
action.PiAgent.ExplainSelection.description=Ask pi to explain the selected code
action.PiAgent.FixSelection.text=Fix with Pi
action.PiAgent.FixSelection.description=Ask pi to fix the selected code
action.PiAgent.SendSelection.text=Send Selection to Pi
action.PiAgent.SendSelection.description=Send the selected code to pi with file context
action.PiAgent.AddDirectory.text=Add Directory to Pi
action.PiAgent.AddDirectory.description=Add the selected directory as a reference in the pi composer
action.PiAgent.SendFile.text=Send File to Pi Agent
action.PiAgent.SendFile.description=Add the whole file as a reference in the pi composer (path only, no contents)
action.PiAgent.ExplainFile.text=Explain File with Pi
action.PiAgent.ExplainFile.description=Ask pi to summarize the whole file and flag anything suspicious
action.PiAgent.GenerateCommitMessage.text=Generate Commit Message with Pi
action.PiAgent.GenerateCommitMessage.description=Ask pi to write a Conventional Commits message for the included changes
