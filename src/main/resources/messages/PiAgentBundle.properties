install.hint.eacces=npm could not write to its global prefix (permissions). Fix the npm prefix or set pi's path manually.
install.hint.network=The registry was unreachable (proxy, firewall or no internet). Pick a different source, use npm's own registry, or install pi yourself and set its path.
