# -- prompts pushed into the composer (spec 015) -----------------------------
# Selection prompts: {0} is `path:line`; the code block itself rides after the
# framing text. MessageFormat interpolation, not the web-side {{}} flavour.
prompt.sendSelection=Regarding `{0}`:\n
prompt.explainSelection=Explain the following code from `{0}` (concise, then any caveats you notice):\n
prompt.fixSelection=Fix the following code from `{0}`. Provide the corrected code and briefly state what was wrong:\n
# "Explain File" pushes a reference chip (the path rides on the chip) and the
# prompt states only the intent — no path, no contents.
prompt.explain.file=Explain the referenced file above: summarize what it does and flag anything suspicious.
prompt.explain.dir=Explain the referenced directory above: summarize its structure and purpose (what each subdirectory and key file is for), and flag anything suspicious.
prompt.explain.caret=(caret at line {0})
# Disabled reasons shown in the popup bubble (spec 009 FR-004, localized 015).
availability.selectFile=Select a file first
availability.selectDirectory=Select a directory first
availability.sendFile.directory=Folders cannot be sent as a file — use Add Directory to Pi
availability.addDirectory.notDirectory=Not a directory — Add Directory references a folder for pi
availability.addDirectory.noDirectory=No directory in the selection — Add Directory references a folder for pi
