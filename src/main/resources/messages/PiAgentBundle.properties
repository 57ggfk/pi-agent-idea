# -- 052: JCEF GPU crash guard (notification + one-click fix + manual recipe) --
notify.gpuCrash.title=Embedded browser GPU keeps crashing
notify.gpuCrash.body=The browser GPU process crashed {0} times in the last minute. A dead GPU process means nothing can be drawn, so embedded pages (Pi Agent panel, preview, DevTools) may stay blank. Disabling GPU acceleration falls back to software rendering; it affects every embedded browser in this IDE and needs a restart.
notify.gpuCrash.action.disable=Disable GPU and restart IDE
notify.gpuCrash.action.manual=How to fix it manually
notify.gpuCrash.manual.title=Disable GPU acceleration manually
notify.gpuCrash.manual.body=Two ways to do it, both need an IDE restart:\n1. Help \u2192 Edit Custom VM Options, add the line -Dide.browser.jcef.gpu.disable=true\n2. Help \u2192 Registry, find ide.browser.jcef.gpu.disable and set it to true\nSoftware rendering is slower but stable.

