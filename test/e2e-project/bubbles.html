<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂浮的泡泡 ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(160deg, #1a2a6c, #2a5298, #4a90d9);
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    cursor: crosshair;
  }

  .bubble {
    position: absolute;
    bottom: -80px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 30% 30%,
      rgba(255, 255, 255, 0.9),
      rgba(255, 255, 255, 0.15) 45%,
      rgba(255, 255, 255, 0.05) 70%
    );
    box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3);
    animation: rise linear infinite;
    pointer-events: none;
  }

  .bubble::after {
    content: "";
    position: absolute;
    top: 18%;
    left: 20%;
    width: 28%;
    height: 18%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    filter: blur(2px);
  }

  @keyframes rise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate(30px, -55vh) scale(1.05); }
    90%  { opacity: 1; }
    100% { transform: translate(-20px, -110vh) scale(0.9); opacity: 0; }
  }

  .title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.95);
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
    pointer-events: none;
    animation: glow 4s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
    50%      { text-shadow: 0 0 50px rgba(255,255,255,0.9); }
  }

  .hint {
    position: absolute;
    bottom: 24px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1 class="title">漂 浮 的 泡 泡</h1>
<p class="hint">点 击 任意 处 释 放 泡 泡</p>

<script>
  // 自动生成随机泡泡
  function spawnBubble(x, y, size, dur) {
    const b = document.createElement("div");
    b.className = "bubble";
    const s = size || Math.random() * 60 + 12;
    b.style.width = s + "px";
    b.style.height = s + "px";
    b.style.left = (x !== undefined ? x : Math.random() * window.innerWidth) + "px";
    if (y !== undefined) {
      b.style.bottom = "auto";
      b.style.top = y + "px";
    }
    b.style.animationDuration = (dur || Math.random() * 8 + 6) + "s";
    document.body.appendChild(b);
    b.addEventListener("animationend", () => b.remove());
  }

  // 初始铺一层泡泡
  for (let i = 0; i < 18; i++) {
    setTimeout(() => spawnBubble(), Math.random() * 4000);
  }

  // 点击处释放一簇泡泡
  document.body.addEventListener("click", (e) => {
    for (let i = 0; i < 6; i++) {
      const dx = (Math.random() - 0.5) * 100;
      const dy = (Math.random() - 0.5) * 60;
      setTimeout(() => spawnBubble(e.clientX + dx, e.clientY + dy), i * 120);
    }
  });

  // 鼠标移动带出小泡泡（节流）
  let last = 0;
  document.body.addEventListener("mousemove", (e) => {
    const now = Date.now();
    if (now - last > 180) {
      last = now;
      spawnBubble(e.clientX, e.clientY, Math.random() * 14 + 6, 3 + Math.random() * 2);
    }
  });
</script>

</body>
</html>
