# Build dependency is the remote IntelliJ IDEA Community 2024.3.1 (243). That
# is the COMPILE baseline, not the lowest supported line: sinceBuild is 233, so
# APIs newer than 2023.3 compile fine and only break on older IDEs. See
# pluginVerification in build.gradle.kts — it pins 233 and 241 for that reason.
