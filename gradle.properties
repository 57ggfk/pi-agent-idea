org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

# Local IDE used as the target platform. Leave unset to auto-detect a local
# IntelliJ (macOS / Windows / Linux / WSL via /mnt/c); when none is found the
# build falls back to the remote IntelliJ IDEA Community 2026.2 artifact.
# Override examples (or use -PideaPath=...):
# ideaPath=/Applications/IntelliJ IDEA.app
# ideaPath=C:/Users/me/AppData/Local/Programs/IntelliJ IDEA
# ideaPath=/opt/idea-IU-262.x
